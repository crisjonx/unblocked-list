<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>

  <!-- Instant redirect -->
  <meta http-equiv="refresh" content="0; url=https://questifyacademy.github.io">

  <!-- Optional JavaScript fallback -->
  <script>
    window.location.replace("https://questifyacademy.github.io");
  </script>
</head>
<body>
  <p>If you are not redirected automatically, 
    <a href="https://questifyacademy.github.io">click here</a>.
  </p>
</body>
</html>
