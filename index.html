<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Home</title>
<link rel="icon" href="/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<style>
  :root{
    --bg:#000000;
    --bg2:#050505;
    --panel:rgba(12,12,12,.78);
    --panel2:rgba(8,8,8,.92);
    --text:#f3f4f6;
    --muted:#9ca3af;
    --muted2:#6b7280;
    --border:rgba(255,255,255,.09);
    --border2:rgba(255,255,255,.16);
    --accent:#ffffff;
    --accent2:#d1d5db;
    --danger:#fca5a5;
    --shadow:0 18px 50px rgba(0,0,0,.65);
    font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at top, rgba(255,255,255,.07), transparent 28%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  body{position:relative}
  body.no-scroll{overflow:hidden}

  body::before,
  body::after{
    content:"";
    position:fixed;
    inset:auto;
    pointer-events:none;
    z-index:-3;
    filter:blur(40px);
    opacity:.38;
    border-radius:999px;
    animation:floatBlob 18s ease-in-out infinite;
  }

  body::before{
    width:320px;
    height:320px;
    left:-90px;
    top:120px;
    background:radial-gradient(circle, rgba(255,255,255,.12), transparent 68%);
  }

  body::after{
    width:420px;
    height:420px;
    right:-150px;
    bottom:50px;
    background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
    animation-delay:-7s;
  }

  @keyframes floatBlob{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(18px,-24px,0) scale(1.08)}
  }

  canvas#matrix{
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
    opacity:.07;
  }

  .wrap{
    min-height:100vh;
    padding:28px 36px 120px;
    display:flex;
    flex-direction:column;
    gap:16px;
    animation:pageIn .7s ease both;
  }

  @keyframes pageIn{
    from{opacity:0; transform:translateY(14px)}
    to{opacity:1; transform:translateY(0)}
  }

  .header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }

  .header-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }

  .dots{display:flex;gap:6px;flex-shrink:0}
  .dot{width:10px;height:10px;border-radius:50%}
  .r{background:#ff5f56}
  .y{background:#ffbd2e}
  .g{background:#27c93f}

  .title-wrap{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:0;
  }

  .title{
    font-size:22px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--accent);
    white-space:nowrap;
  }

  .header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }

  .btn{
    appearance:none;
    border:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    color:var(--text);
    font:inherit;
    font-size:13px;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease, opacity .12s ease;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }

  .btn:hover{
    transform:translateY(-1px);
    border-color:var(--border2);
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  }

  .btn.primary{
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
  }

  .btn:disabled,
  .icon-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
  }

  .term{
    width:100%;
    max-width:980px;
    background:var(--panel);
    border:1px solid rgba(255,255,255,.05);
    padding:14px 16px;
    border-radius:16px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(10px);
    position:relative;
  }

  .prompt{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .caret{
    color:var(--muted);
    font-weight:600;
    min-width:74px;
  }

  .input-wrap{
    position:relative;
    flex:1;
  }

  .terminal-input{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font:inherit;
    font-size:16px;
    padding:6px 4px;
  }

  .terminal-input::placeholder{color:var(--muted2)}

  .suggestions{
    position:absolute;
    top:100%;
    left:0;
    margin-top:8px;
    width:min(680px,100%);
    background:rgba(0,0,0,.96);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    overflow:hidden;
    display:none;
    z-index:50;
    box-shadow:0 18px 40px rgba(0,0,0,.7);
    backdrop-filter:blur(12px);
  }

  .suggestions ul{
    margin:0;
    padding:8px;
    list-style:none;
    max-height:320px;
    overflow:auto;
  }

  .suggestions li{
    padding:10px 12px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
    cursor:pointer;
    color:var(--muted);
    font-size:13px;
  }

  .suggestions li:hover,
  .suggestions li.active{
    background:rgba(255,255,255,.06);
    color:var(--text);
  }

  .suggest-name{font-weight:700}
  .suggest-path{
    font-size:11px;
    color:var(--muted2);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:45%;
  }

  .section{
    width:100%;
    max-width:1220px;
    margin-top:2px;
    transition:opacity .18s ease, transform .18s ease, max-height .18s ease;
  }

  .section.hidden-search{
    opacity:0;
    transform:translateY(-8px);
    pointer-events:none;
    max-height:0;
    overflow:hidden;
    margin-top:0;
  }

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }

  .section-title{
    font-size:13px;
    color:var(--muted);
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .mini-link{
    font-size:12px;
    color:var(--accent2);
    text-decoration:none;
  }

  .mini-link:hover{text-decoration:underline}

  .featured-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
  }

  .feature-card{
    display:block;
    text-decoration:none;
    color:var(--text);
    border-radius:16px;
    border:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
    padding:12px 12px 11px;
    min-height:74px;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }

  .feature-card:hover{
    transform:translateY(-2px);
    border-color:var(--border2);
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  }

  .feature-name{
    font-weight:700;
    line-height:1.3;
    font-size:13px;
  }

  .feature-meta{
    margin-top:7px;
    font-size:11px;
    color:var(--muted);
    line-height:1.35;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:10px;
  }

  a.item{
    display:block;
    padding:12px;
    border-radius:14px;
    text-decoration:none;
    color:var(--text);
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
    border:1px solid var(--border);
    font-size:13px;
    box-shadow:inset 0 -8px 18px rgba(0,0,0,.36);
    transition:transform .09s ease, border-color .09s ease, background .09s ease;
    min-height:74px;
  }

  a.item:hover{
    transform:translateY(-3px);
    border-color:var(--border2);
    background:rgba(255,255,255,.045);
  }

  .name{
    font-weight:700;
    line-height:1.35;
    color:var(--text);
  }

  .path{
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
    display:block;
    word-break:break-all;
    line-height:1.35;
  }

  #gameOverlay{
    position:fixed;
    inset:0;
    display:block;
    z-index:2000;
    background:#000;
    opacity:0;
    pointer-events:none;
    transform:translateX(100%);
    transition:transform .34s cubic-bezier(.22,.61,.36,1), opacity .22s ease;
  }
  #gameOverlay.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(0);
  }
  #gameOverlay.closing{
    opacity:1;
    pointer-events:none;
    transform:translateX(100%);
  }
  #gameFrame{
    width:100%;
    height:100%;
    border:0;
    background:#000;
  }

  .back-edge{
    position:fixed;
    left:0;
    top:0;
    width:76px;
    height:100%;
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding-left:10px;
    background:linear-gradient(90deg, rgba(255,255,255,.13), rgba(255,255,255,.02), transparent);
    z-index:2100;
  }
  .back-edge.show{
    opacity:1;
    pointer-events:auto;
  }
  .back-button{
    width:44px;
    height:78px;
    border-radius:0 16px 16px 0;
    border:1px solid var(--border2);
    border-left:none;
    background:rgba(0,0,0,.75);
    color:var(--text);
    font-size:22px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.45);
    transform:translateX(-6px);
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .back-edge.show .back-button,
  .back-edge:hover .back-button{
    transform:translateX(0);
  }
  .back-button:hover{
    background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.26);
  }

  .chat-panel{
    position:fixed;
    right:20px;
    bottom:20px;
    width:min(420px, calc(100vw - 24px));
    height:min(620px, calc(100vh - 24px));
    z-index:2500;
    display:none;
    flex-direction:column;
    overflow:hidden;
    border-radius:22px;
    border:1px solid var(--border);
    background:rgba(0,0,0,.90);
    backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,.7);
  }
  .chat-panel.open{display:flex}

  .chat-head{
    padding:14px 14px 12px;
    border-bottom:1px solid rgba(255,255,255,.07);
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  }

  .chat-head h2{
    margin:0;
    font-size:15px;
    color:var(--text);
  }

  .chat-head .small{
    margin-top:6px;
    font-size:11px;
    line-height:1.45;
    color:var(--muted);
  }

  .chat-head-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }

  .icon-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .icon-btn:hover{
    border-color:var(--border2);
    background:rgba(255,255,255,.06);
  }

  .chat-messages{
    flex:1;
    overflow:auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .msg{
    max-width:96%;
    border-radius:16px;
    padding:11px 12px;
    border:1px solid rgba(255,255,255,.07);
    line-height:1.55;
    font-size:13px;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  .msg.user{
    align-self:flex-end;
    background:rgba(255,255,255,.05);
    border-color:rgba(255,255,255,.12);
    color:var(--text);
  }

  .msg.assistant{
    align-self:flex-start;
    background:rgba(255,255,255,.02);
    color:var(--text);
  }

  .msg.error{
    align-self:flex-start;
    background:rgba(252,165,165,.08);
    border-color:rgba(252,165,165,.18);
    color:#ffd7d7;
  }

  .msg :is(h1,h2,h3,h4,h5,h6){
    margin:.35em 0 .4em;
    line-height:1.2;
  }
  .msg p{margin:.4em 0}
  .msg ul,.msg ol{margin:.35em 0 .35em 1.25em}
  .msg blockquote{
    margin:.5em 0;
    padding:.1em .75em;
    border-left:3px solid rgba(255,255,255,.22);
    color:var(--muted);
  }
  .msg table{
    width:100%;
    border-collapse:collapse;
    margin:.5em 0;
    font-size:12px;
  }
  .msg th,.msg td{
    border:1px solid rgba(255,255,255,.12);
    padding:6px 8px;
    vertical-align:top;
  }
  .msg a{
    color:var(--text);
    text-decoration:underline;
    text-decoration-color:rgba(255,255,255,.4);
    word-break:break-all;
  }
  .msg pre{
    overflow:auto;
    padding:12px;
    border-radius:14px;
    background:#050505;
    border:1px solid rgba(255,255,255,.12);
  }
  .msg code{font-family:inherit}
  .msg p code, .msg li code{
    padding:.12rem .32rem;
    border-radius:6px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
  }

  .chat-input-wrap{
    padding:12px;
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;
    gap:10px;
    background:rgba(0,0,0,.5);
  }

  .chat-input{
    flex:1;
    resize:none;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.03);
    color:var(--text);
    padding:11px 12px;
    font:inherit;
    font-size:13px;
    outline:none;
    min-height:44px;
    max-height:140px;
  }

  .chat-input:focus{
    border-color:var(--border2);
    box-shadow:0 0 0 3px rgba(255,255,255,.05);
  }

  .send-btn{min-width:84px}

  .modal{
    position:fixed;
    inset:0;
    display:none;
    z-index:2600;
    background:rgba(0,0,0,.76);
    backdrop-filter:blur(8px);
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal.open{display:flex}

  .modal-card{
    width:min(640px, 100%);
    border-radius:22px;
    border:1px solid var(--border);
    background:rgba(0,0,0,.92);
    box-shadow:0 24px 70px rgba(0,0,0,.72);
    overflow:hidden;
  }

  .modal-head{
    padding:16px 16px 12px;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border-bottom:1px solid rgba(255,255,255,.07);
  }

  .modal-head h2{
    margin:0;
    color:var(--text);
    font-size:16px;
  }

  .modal-body{
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .field label{
    font-size:12px;
    color:var(--muted);
  }

  .field input,
  .field textarea{
    width:100%;
    box-sizing:border-box;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.03);
    color:var(--text);
    padding:11px 12px;
    font:inherit;
    font-size:13px;
    outline:none;
  }

  .field textarea{
    min-height:120px;
    resize:vertical;
  }

  .field input:focus,
  .field textarea:focus{
    border-color:var(--border2);
    box-shadow:0 0 0 3px rgba(255,255,255,.05);
  }

  .modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    flex-wrap:wrap;
    margin-top:4px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:4000;
    padding:10px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:rgba(0,0,0,.9);
    color:var(--text);
    font-size:12px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
    display:none;
    max-width:min(92vw, 560px);
    text-align:center;
  }
  .toast.show{display:block}

  @media (max-width: 820px){
    .wrap{padding:18px 14px 110px}
    .chat-panel{
      left:12px;
      right:12px;
      width:auto;
      bottom:12px;
      height:min(72vh, 620px);
    }
    .grid{
      grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
    }
    .featured-grid{
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    }
  }

  /* Theme presets */
  html[data-theme="monochrome"]{
    --bg:#000000;
    --bg2:#050505;
    --panel:rgba(12,12,12,.78);
    --panel2:rgba(8,8,8,.92);
    --text:#f3f4f6;
    --muted:#9ca3af;
    --muted2:#6b7280;
    --border:rgba(255,255,255,.09);
    --border2:rgba(255,255,255,.16);
    --accent:#ffffff;
    --accent2:#d1d5db;
  }
  html[data-theme="neon"]{
    --bg:#05020a;
    --bg2:#0d0820;
    --panel:rgba(15,10,24,.78);
    --panel2:rgba(10,6,18,.92);
    --text:#f7f2ff;
    --muted:#c4b5fd;
    --muted2:#9f86ff;
    --border:rgba(196,181,253,.18);
    --border2:rgba(245,208,254,.28);
    --accent:#f5d0fe;
    --accent2:#e9d5ff;
  }
  html[data-theme="arctic"]{
    --bg:#041019;
    --bg2:#081827;
    --panel:rgba(8,18,30,.82);
    --panel2:rgba(6,14,24,.94);
    --text:#ecfeff;
    --muted:#a5f3fc;
    --muted2:#67e8f9;
    --border:rgba(165,243,252,.18);
    --border2:rgba(207,250,254,.30);
    --accent:#cffafe;
    --accent2:#a5f3fc;
  }
  html[data-theme="amber"]{
    --bg:#120d05;
    --bg2:#241607;
    --panel:rgba(24,16,8,.82);
    --panel2:rgba(18,12,6,.94);
    --text:#fff7ed;
    --muted:#fdba74;
    --muted2:#fb923c;
    --border:rgba(253,186,116,.20);
    --border2:rgba(255,237,213,.32);
    --accent:#ffedd5;
    --accent2:#fed7aa;
  }
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="header">
    <div class="header-left">
      <div class="dots" aria-hidden="true">
        <span class="dot r"></span>
        <span class="dot y"></span>
        <span class="dot g"></span>
      </div>
      <div class="title-wrap">
        <div class="title">unblocked-list</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" id="themeBtn" type="button">Theme</button>
      <button class="btn" id="suggestBtn" type="button">Suggest games</button>
      <button class="btn primary" id="openChatBtn" type="button">✦ AI chat</button>
    </div>
  </div>

  <div class="term" role="search" aria-label="terminal search">
    <div class="prompt">
      <div class="caret">&gt; search</div>
      <div class="input-wrap">
        <input id="termInput" class="terminal-input" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Search games..." />
        <div id="suggestions" class="suggestions" role="listbox" aria-label="suggestions">
          <ul id="suggestList"></ul>
        </div>
      </div>
    </div>
  </div>

  <div class="section" id="recommendationsSection">
    <div class="section-head">
      <div class="section-title">Recommendations</div>
    </div>
    <div id="featuredGrid" class="featured-grid"></div>
  </div>

  <div class="section" id="all-games">
    <div class="section-head">
      <div class="section-title">All games</div>
    </div>

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[s]));
}

function prettyName(name) {
  if (SPECIAL_NAMES.has(name)) return SPECIAL_NAMES.get(name);
  const rawTitle = name
    .replace(/\/+ /g, ' / ')
    .replace(/[-_]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  return rawTitle
    .split(' ')
    .map(word => {
      if (!word) return word;
      if (/^\d+$/.test(word)) return word;
      if (/^[A-Z0-9.]+$/.test(word)) return word;
      return word[0].toUpperCase() + word.slice(1);
    })
    .join(' ')
    .replace(/\bIo\b/g, 'IO');
}

function toPath(name) {
  return './' + name.split('/').map(encodeURIComponent).join('/') + '/';
}

function toPrettyPath(name) {
  return '/' + name;
}

function computeSuggestions(q) {
  if (!q) return [];
  const lower = q.toLowerCase();
  const starts = files.filter(v => v.toLowerCase().startsWith(lower));
  const contains = files.filter(v => !v.toLowerCase().startsWith(lower) && v.toLowerCase().includes(lower));
  return [...starts, ...contains].slice(0, 8);
}

function setActive(index) {
  const lis = suggestList.querySelectorAll('li');
  lis.forEach(li => li.classList.remove('active'));
  if (index >= 0 && lis[index]) lis[index].classList.add('active');
  active = index;
}

function renderSuggestions(arr) {
  suggestions = arr;
  active = arr.length ? 0 : -1;

  if (!arr.length) {
    suggestionsBox.style.display = 'none';

    return;

  suggestionsBox.style.display = 'block';
  suggestList.innerHTML = '';

  arr.forEach((s, i) => {
    const li = document.createElement('li');
    li.setAttribute('role', 'option');
    li.dataset.index = i;
    li.innerHTML = `<span class="suggest-name">${escapeHtml(prettyName(s))}</span><span class="suggest-path">${escapeHtml('/' + s)}</span>`;
    if (i === active) li.classList.add('active');
    li.addEventListener('mouseenter', () => setActive(i));
    li.addEventListener('mousedown', ev => {
      ev.preventDefault();
      openGame(s);
    });
    suggestList.appendChild(li);
  });
}

function normalizeText(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function findLocalGame(query) {
  const q = normalizeText(query);
  if (!q) return null;

  const aliasMap = new Map([
    ['slope', 'slope'],
    ['drift boss', 'drift-boss'],
    ['basket random', 'basket-random'],
    ['fnaf', 'fnaf'],
    ['five nights at freddys', 'fnaf'],
    ['five nights at freddy s', 'fnaf'],
    ['cookie clicker', 'cookie-clicker'],
    ['subway surfers', 'subway-surfers'],
    ['retro bowl', 'retro-bowl'],
    ['run 3', 'run-3'],
    ['tunnel rush', 'tunnel-rush'],
    ['time shooter 2', 'time-shooter-2'],
    ['time shooter 3 swat', 'time-shooter-3-swat']
  ]);

  if (aliasMap.has(q) && files.includes(aliasMap.get(q))) return aliasMap.get(q);

  const exact = files.find(f => normalizeText(prettyName(f)) === q || normalizeText(f) === q);
  if (exact) return exact;

  const partial = files.find(f => normalizeText(prettyName(f)).includes(q) || normalizeText(f).includes(q));
  return partial || null;
}

function openGame(name, push = true) {

  gameOverlay.classList.remove('closing');

  document.body.classList.add('no-scroll');
  gameOpen = true;
  backEdge.classList.remove('show');

  if (push) {
    history.pushState({ view: 'game', name }, '', '#game=' + encodeURIComponent(name));
  }

  setTimeout(() => input.blur(), 0);
}

function closeGame(fromPop = false) {
  gameOverlay.classList.add('closing');
  gameOverlay.classList.remove('open');
  gameOverlay.setAttribute('aria-hidden', 'true');
  backEdge.classList.remove('show');
  document.body.classList.remove('no-scroll');
  gameOpen = false;

  setTimeout(() => {
    gameFrame.src = 'about:blank';
    gameOverlay.classList.remove('closing');
  }, 340);

  if (!fromPop && location.hash.startsWith('#game=')) {
    history.back();
  }
}

function renderAssistantMessage(text, className = '') {
  const div = document.createElement('div');
  div.className = `msg assistant ${className}`.trim();

  const rendered = marked.parse(text ?? '');
  const sanitized = DOMPurify.sanitize(rendered, {
    USE_PROFILES: { html: true }
  });

  div.innerHTML = sanitized;
  chatMessages.appendChild(div);

  if (window.renderMathInElement) {
    try {
      renderMathInElement(div, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    } catch {}
  }

  if (window.hljs) {
    div.querySelectorAll('pre code').forEach(code => {
      try { hljs.highlightElement(code); } catch {}
    });
  }

  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function renderUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

  chatPanel.classList.toggle('open', chatOpen);

    setTimeout(() => chatInput.focus(), 0);
    if (!chatMessages.dataset.booted) {
      renderAssistantMessage(
        `Hi. I can help with **game recommendations**, site help, and general questions.

Try: [recommend me games like slope](#recommend-slope)`
      );
      chatMessages.dataset.booted = '1';
    }
  }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

async function sendChat() {
  const text = chatInput.value.trim();
  if (!text || sendLock) return;

  sendLock = true;
  chatSendBtn.disabled = true;
  chatInput.disabled = true;

  renderUserMessage(text);
  chatInput.value = '';
  autoGrow(chatInput);

  const localGame = findLocalGame(text);
  if (localGame) {
    conversation.push({ role: 'user', content: text });
    conversation.push({ role: 'assistant', content: `Opening **${prettyName(localGame)}**.\n\nPath: \`${toPrettyPath(localGame)}\`` });
    openGame(localGame);
    renderAssistantMessage(`Opening **${prettyName(localGame)}**.\n\nPath: \`${toPrettyPath(localGame)}\``);
    sendLock = false;
    chatSendBtn.disabled = false;
    chatInput.disabled = false;
    chatInput.focus();
    return;
  }

  const pending = renderAssistantMessage('Thinking...');
  conversation.push({ role: 'user', content: text });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: conversation,
        model: 'openai/gpt-4o-mini'
      })
    });

    const data = await res.json();

    if (!res.ok) {
      const msg = data?.error || data?.message || 'Chat request failed.';
      pending.classList.add('error');
      pending.innerHTML = DOMPurify.sanitize(marked.parse(msg));
      conversation.push({ role: 'assistant', content: msg });
      return;
    }

    const reply =
      data?.choices?.[0]?.message?.content ||
      data?.message?.content ||
      data?.response ||
      'No response returned.';

    pending.innerHTML = DOMPurify.sanitize(marked.parse(reply));
    if (window.renderMathInElement) {
      try {
        renderMathInElement(pending, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      } catch {}
    }
    if (window.hljs) {
      pending.querySelectorAll('pre code').forEach(code => {
        try { hljs.highlightElement(code); } catch {}
      });
    }

    conversation.push({ role: 'assistant', content: reply });
  } catch (err) {
    const msg = 'Network error while contacting the chat proxy.';
    pending.classList.add('error');
    pending.innerHTML = DOMPurify.sanitize(marked.parse(msg));
    conversation.push({ role: 'assistant', content: msg });
  } finally {
    sendLock = false;
    chatSendBtn.disabled = false;
    chatInput.disabled = false;
    chatInput.focus();
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
}

function openSuggest() {
  suggestModal.classList.add('open');
  suggestModal.setAttribute('aria-hidden', 'false');

async function submitSuggestion() {
  const name = gameName.value.trim();
  const notes = gameNotes.value.trim();

  if (!name && !notes) {
    showToast('Add a game name or details first');
    return;
  }

  submitSuggestBtn.disabled = true;

  try {
    const res = await fetch('/api/suggestions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        notes,
        page: location.href,
        when: new Date().toISOString()
      })
    });

    const data = await res.json();
    if (!res.ok || !data.ok) {
      throw new Error(data.error || 'Save failed');
    }

    gameName.value = '';
    gameNotes.value = '';
    closeSuggest();
    showToast('Suggestion saved');
  } catch (err) {
    showToast(err.message || 'Failed to save suggestion');
  } finally {
    submitSuggestBtn.disabled = false;
  }
}

function downloadSuggestionsExport() {
  const exportUrl = '/suggestions.jsonl';
  const a = document.createElement('a');
  a.href = exportUrl;
  a.download = 'suggestions.jsonl';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function cycleTheme() {
  themeIndex = (themeIndex + 1) % THEMES.length;
  applyTheme(THEMES[themeIndex].key);
}

function applyTheme(key) {
  document.documentElement.dataset.theme = key;
  localStorage.setItem('ui-theme', key);
  const current = THEMES.find(t => t.key === key) || THEMES[0];
  themeBtn.textContent = `Theme: ${current.name}`;
  themeIndex = Math.max(0, THEMES.findIndex(t => t.key === key));
}

function isExportRoute() {
  return location.pathname.endsWith('/sg-export') || location.hash === '#sg-export';
}

/* events */
input.addEventListener('input', () => {
  const q = input.value;
  renderSuggestions(computeSuggestions(q));
  renderGrid(q);
  recommendationsSection.classList.toggle('hidden-search', q.trim().length > 0);
});

input.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (suggestions.length) {
      active = (active + 1 + suggestions.length) % suggestions.length;
      setActive(active);
      suggestList.querySelectorAll('li')[active]?.scrollIntoView({ block: 'nearest' });
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (suggestions.length) {
      active = (active - 1 + suggestions.length) % suggestions.length;
      setActive(active);
      suggestList.querySelectorAll('li')[active]?.scrollIntoView({ block: 'nearest' });
    }
  } else if (e.key === 'Tab') {
    if (suggestions.length) {
      e.preventDefault();
      input.value = suggestions[active >= 0 ? active : 0];
      renderSuggestions(computeSuggestions(input.value));
      renderGrid(input.value);
      recommendationsSection.classList.add('hidden-search');
    }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const typed = input.value.trim();
    if (!typed) return;
    const exact = files.find(f => f.toLowerCase() === typed.toLowerCase());
    const local = findLocalGame(typed);
    if (active >= 0 && suggestions[active]) {
      openGame(suggestions[active]);
    } else if (exact) {
      openGame(exact);
    } else if (local) {
      openGame(local);
    } else if (suggestions.length === 1) {
      openGame(suggestions[0]);
    }
  } else if (e.key === 'Escape') {
    suggestions = [];
    renderSuggestions([]);
  }
});

document.addEventListener('click', ev => {
  if (!ev.target.closest('.term')) {
    suggestions = [];
    renderSuggestions([]);
  }
});

backBtn.addEventListener('click', () => history.back());
themeBtn.addEventListener('click', cycleTheme);

gameOverlay.addEventListener('mousemove', e => {
  if (!gameOpen) return;
  backEdge.classList.toggle('show', e.clientX <= 18);
});

gameOverlay.addEventListener('mouseleave', () => {
  backEdge.classList.remove('show');
});

window.addEventListener('popstate', () => {
  if (gameOpen) closeGame(true);
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (gameOpen) {
      history.back();
      return;
    }
    if (chatPanel.classList.contains('open')) toggleChat(false);
    if (suggestModal.classList.contains('open')) closeSuggest();
  }
});

gameOverlay.addEventListener('click', ev => {
  if (ev.target === gameOverlay) {
    history.back();
  }
});

chatInput.addEventListener('input', () => autoGrow(chatInput));
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

chatMessages.addEventListener('click', e => {
  const link = e.target.closest('a[href="#recommend-slope"]');
  if (!link) return;
  e.preventDefault();
  chatInput.value = 'recommend me games like slope';
  autoGrow(chatInput);
  sendChat();
});

chatSendBtn.addEventListener('click', sendChat);
openChatBtn.addEventListener('click', () => toggleChat(true));
chatCloseBtn.addEventListener('click', () => toggleChat(false));
chatClearBtn.addEventListener('click', () => {
  chatMessages.innerHTML = '';
  conversation.length = 1;
  renderAssistantMessage('Chat cleared. Ask me anything.');
  showToast('Chat cleared');
});

suggestBtn.addEventListener('click', openSuggest);
cancelSuggestBtn.addEventListener('click', closeSuggest);
suggestModal.addEventListener('click', ev => {
  if (ev.target === suggestModal) closeSuggest();
});
submitSuggestBtn.addEventListener('click', submitSuggestion);

document.getElementById('jumpAll')?.addEventListener?.('click', e => {
  e.preventDefault();
  document.getElementById('all-games').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* init */
renderFeatured();
renderGrid('');
input.value = '';
setTimeout(() => input.focus(), 100);

const savedTheme = localStorage.getItem('ui-theme') || 'monochrome';
applyTheme(savedTheme);

if (isExportRoute()) {
  setTimeout(downloadSuggestionsExport, 150);
}

if (location.hash.startsWith('#game=')) {
  const encoded = location.hash.slice(6);
  const decoded = decodeURIComponent(encoded);
  if (files.includes(decoded)) {
    history.replaceState({ view: 'game', name: decoded }, '', location.hash);
    openGame(decoded, false);
  }
}

if (location.hash === '#sg-export') {
  downloadSuggestionsExport();
  history.replaceState({}, '', '/');
}

window.addEventListener('hashchange', () => {
  if (location.hash === '#sg-export') {
    downloadSuggestionsExport();
    history.replaceState({}, '', '/');
  }
});

/* matrix */
(function matrix(){
  const c = document.getElementById('matrix');
  const ctx = c.getContext('2d');
  let cols = Math.max(6, Math.floor(window.innerWidth / 14));
  let drops = Array.from({length:cols}, ()=>Math.floor(Math.random()*40));
  const chars = '01<>/\\|[]{}abcdefghijklmnopqrstuvwxyz0123456789'.split('');

  function resize(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    cols = Math.max(6, Math.floor(c.width / 14));
    drops = Array.from({length:cols}, ()=>Math.floor(Math.random()*40));
  }

  window.addEventListener('resize', resize);
  resize();

  function step(){
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.font = '12px "JetBrains Mono", monospace';
    const colW = c.width / Math.max(1, cols);

    for(let i=0;i<cols;i++){
      const x = i*colW + 6;
      const y = drops[i]*14;
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)], x, y);
      drops[i]++;
      if(drops[i]*14 > c.height || Math.random() > 0.995) drops[i] = 0;
    }

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
})();
</script>
